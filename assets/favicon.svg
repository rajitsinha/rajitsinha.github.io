<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="p" x1="26%" y1="20%" x2="78%" y2="88%">
      <stop offset="0" stop-color="#7fb1ff"/>
      <stop offset="55%" stop-color="#4d8dff"/>
      <stop offset="100%" stop-color="#1f4fa8"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="#06070b"/>

  <!-- orbit, tilted the same way as the one on the site -->
  <g transform="rotate(-26 32 33)">
    <ellipse cx="32" cy="33" rx="24" ry="9.5"
             fill="none" stroke="#cfdcf5" stroke-opacity=".42" stroke-width="2.6"/>
  </g>

  <!-- planet -->
  <circle cx="32" cy="33" r="12.4" fill="url(#p)"/>

  <!-- front half of the orbit, so it reads as passing in front -->
  <g transform="rotate(-26 32 33)">
    <path d="M 8 33 A 24 9.5 0 0 0 56 33"
          fill="none" stroke="#cfdcf5" stroke-opacity=".72" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- the rocket, out on the orbit -->
  <g transform="rotate(-26 32 33)">
    <circle cx="55" cy="31.4" r="4.6" fill="#06070b"/>
    <circle cx="55" cy="31.4" r="3.1" fill="#ffffff"/>
  </g>
</svg>
